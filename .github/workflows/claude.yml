# Claude Code on GitHub: an "@claude" mention in an issue, an issue comment,
# a PR review or a PR review comment starts a Claude Code run here, billed to
# the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN, from
# `claude setup-token`). Standing rules for these runs are in CLAUDE.md
# ("GitHub Actions runs").
#
# Who can start a run (the repo is public):
#   - people with write access (author_association OWNER / MEMBER / COLLABORATOR
#     here; the action then re-checks write permission through the API);
#   - at most ONE bot account, named in the repo variable CLAUDE_ALLOWED_BOT
#     (e.g. `gh variable set CLAUDE_ALLOWED_BOT --body "my-bot[bot]"`).
#     Unset = no bots. Never set it to '*'.
# Everyone else's mentions never get past the job condition below.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) ||
        (vars.CLAUDE_ALLOWED_BOT != '' &&
          (github.actor == vars.CLAUDE_ALLOWED_BOT || github.actor == format('{0}[bot]', vars.CLAUDE_ALLOWED_BOT)))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ vars.CLAUDE_ALLOWED_BOT }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npm install:*),Bash(npm run lint),Bash(npm test),Bash(npm run build),Bash(npx tsc --noEmit),Bash(npx prisma generate),Bash(npx prisma validate),Bash(npx prisma format),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr merge:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh issue view:*)"
            --disallowedTools "Bash(npm run db:push),Bash(npx prisma db:*),Bash(npx prisma migrate:*),Bash(prisma db:*),Bash(prisma migrate:*),Bash(vercel:*),Bash(npx vercel:*),Bash(env),Bash(printenv:*)"
