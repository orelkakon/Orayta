# Manual trigger for the Web Push dispatcher (/api/push/dispatch). The regular
# heartbeat is cron-job.org → /api/push/tick every 5 minutes, which wakes the
# database only when someone is due. A GitHub schedule here would wake Neon
# every run (and GitHub skipped/delayed it anyway), so it is manual-only.
name: push-dispatch

on:
  workflow_dispatch:

concurrency:
  group: push-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call dispatcher
        env:
          DISPATCH_URL: ${{ secrets.DISPATCH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DISPATCH_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "DISPATCH_URL / CRON_SECRET secrets are not set — skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$DISPATCH_URL"
